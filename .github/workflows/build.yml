name: Build Mod JARs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build both modules
        run: ./gradlew clean build --no-daemon --console=plain --stacktrace

      - name: List produced artifacts
        if: always()
        run: find . -path "*/build/libs/*.jar" -type f -exec ls -lh {} \;

      - name: Upload JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: needs-of-nature-1.20.1
          path: |
            needsofnature/build/libs/*.jar
            animationdirector/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
